<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Javascript Drum Kit</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <div class="button" data-key="65">
            <div>A</div>
            <span>Boom</span>
        </div>
        <div class="button" data-key="83">
            <div>S</div>
            <span>Clap</span>
        </div>
        <div class="button" data-key="68">
            <div>D</div>
            <span>Hithat</span>
        </div>
        <div class="button" data-key="70">
            <div>F</div>
            <span>Kick</span>
        </div>
        <div class="button" data-key="71">
            <div>G</div>
            <span>Openhat</span>
        </div>
        <div class="button" data-key="72">
            <div>H</div>
            <span>Ride</span>
        </div>
        <div class="button" data-key="74">
            <div>J</div>
            <span>Snare</span>
        </div>
        <div class="button" data-key="75">
            <div>K</div>
            <span>Tink</span>
        </div>
        <div class="button" data-key="76">
            <div>L</div>
            <span>Tom</span>
        </div>
    </main>
    <audio data-key="65" src="sounds/boom.wav"></audio>
    <audio data-key="83" src="sounds/clap.wav"></audio>
    <audio data-key="68" src="sounds/hihat.wav"></audio>
    <audio data-key="70" src="sounds/kick.wav"></audio>
    <audio data-key="71" src="sounds/openhat.wav"></audio>
    <audio data-key="72" src="sounds/ride.wav"></audio>
    <audio data-key="74" src="sounds/snare.wav"></audio>
    <audio data-key="75" src="sounds/tink.wav"></audio>
    <audio data-key="76" src="sounds/tom.wav"></audio>
    <script>
        window.addEventListener('keydown', function(e){
            const sound = document.querySelectorAll(`audio[data-key='${e.keyCode}']`)[0];
            const button = document.querySelectorAll(`.button[data-key='${e.keyCode}'`)[0];
            if(!sound) return;
            sound.currentTime = 0;
            sound.play();
            button.classList.add('playing');
        })
        
        const removeClass = e =>{
            if(e.propertyName!='transform') return;
            e.target.classList.remove('playing');
        }

        const keys = document.querySelectorAll('.button');
        keys.forEach(key => {
            key.addEventListener('transitionend', removeClass);
        });
    </script>
</body>
</html>
