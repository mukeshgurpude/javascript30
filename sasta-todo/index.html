<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width,initial-scale=1.0">
        <title>TODO List</title>
        <link href="todo.css" type="text/css" rel="stylesheet">
    </head>
    <body>
        <span id="loader"></span>
        <main>
            <h1>Tasks</h1>
            <ul class="tasks"></ul>
            <span>No tasks here</span>
            <form class="add">
                <label for="addItem"></label>
                <input type="text" placeholder="Task Name" id="addItem" required disabled autocomplete="off" autofocus>
                <input type="submit" value="Add Task" disabled>
            </form>
            <div class="control">
                <button name="check">Mark all as Done</button>
                <button name="uncheck">Uncheck all</button>
                <button name="clear">Remove all</button>
            </div>
        </main>
        <script type="text/javascript" src="list.js"></script>
    </body>
</html>
