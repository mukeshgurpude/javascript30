<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speaking Words</title>
    <style>
        :root{--secondary: hsl(221, 57%, 51%);}
        button, textarea, input{outline: none;}
        main{
            min-width: 300px;
            margin: auto;
            display: flex;
            flex-flow: wrap column;
            width: max-content;
            /* background-color: rgb(93 87 87); */
            box-shadow: 0 0 1em #000;
            padding: 1em;
            margin-top: 1em;
        }
        #options{
            width: 100%;
            display: flex;
            flex-flow: column;
            gap: 8px;
            padding: 1em 0;
        }
        [type=range]{width: 80%;}
        .paste{position: absolute;right: 1em;cursor: pointer;}
        footer{display: flex;width: 100%;gap: 1em;}
        footer>button{flex: 1; border: 2px solid var(--secondary);color: var(--secondary);padding: 8px;font-weight: 500;}
        button:hover{
            background-color: var(--secondary);
            color: #fff;
        }

        header{
            padding: 8px 1em;
            background-color: var(--secondary);
            color: #fff;
        }
    </style>
</head>
<body>
    <main>
        <header><h1>Unknown Title</h1></header>
        <section id="options">
            <select name="voice">
                <option>Choose a Language</option>
            </select>
            <label>Pitch: <input type="range" name="pitch" max="100" min="0" step="1"></label>
            <label>Rate: <input type="range" name="rate" max="100" min="0" step="1"></label>
        </section>
        <section style="position: relative;">
            <textarea name="text" cols="50" rows="10" placeholder="Type or paste your text here..."></textarea>
            <span class="paste" title="Click to paste text from clipboard">📋</span>
        </section>
        <footer>
            <button id="stop">Stop</button>
            <button id="speak">Speak</button>
        </footer>
    </main>
    <script src="speak.js" async></script>
</body>
</html>
