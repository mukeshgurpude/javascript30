<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PokeDex</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="logo"></div>
        <span class="logo-text">Pokemon Searcher</span>
        <label><input list="search" type="search" autofocus placeholder="e.g. Pikachu"><button class="load">Search</button></label>
        <datalist id="search">
        </datalist>
    </header>
    <h1>Search for a pokemon above</h1>
    <span id="loader"></span>
    <main>
        <section id="image"></section>
        <section id="basic-details"></section>
    </main>
    <h2 style="display: none;">You may also like</h2>
    <section id="more">
        <section class="suggestion">
            <div class="name"></div>
        </section>
        <section class="suggestion">
            <div class="name"></div>
        </section>
        <section class="suggestion">
            <div class="name"></div>
        </section>
        <section class="suggestion">
            <div class="name"></div>
        </section>
        <section class="suggestion">
            <div class="name"></div>
        </section>
    </section>
    <footer></footer>
    <script type="text/javascript">

        function handleImage(url, element){
            const img = document.createElement('img');
            img.onerror = function(){
                element.style.backgroundImage = `url("images/unavailable.png")`;
            }
            img.src = url;
            img.remove();
        }

        const endpoint = "https://pokeapi.co/api/v2/pokemon/";
        const more = document.querySelectorAll('.suggestion');
        const heading = document.querySelector('h1');
        const main = document.querySelector('main');
        const loader = document.querySelector('#loader')

        function catchPokemon(){
            let name = ((this.value && this.value.toLowerCase() )|| this.firstElementChild.innerHTML.toLowerCase());
            loader.style.display = 'block';
            fetch(endpoint + name).then(response=>response.json()).then(
                data=>{
                    const imageUrl = data.sprites?.other?.dream_world?.front_default || data.sprites?.front_default;
                    document.querySelector('h1').innerHTML = ``;
                    document.getElementById('image').style.backgroundImage = `url("${imageUrl}")`;
                    handleImage(imageUrl, document.getElementById("image"));
                    let details = `<h2>${data.name}</h2>`;
                    data.types.forEach(type=>{
                        details += `<span class="type">${type.type.name}</span>`;
                    })
                    details += `<a target="_blank" class="know" href="https://bulbapedia.bulbagarden.net/w/index.php?title=${data.name}">Know More</a>`;
                    document.getElementById('basic-details').innerHTML = details;
                    generateMore(data.id);
                    main.style.display = 'flex';
                    loader.style.display = 'none';

                }).catch(function(e){
                    console.error(e)
                    heading.innerHTML = `${name} not found`;

                    main.style.display = 'none';
                    loader.style.display = 'none';
                })
            search.value = '';
        }

        function addToMore(id, i){
            fetch(endpoint + id).then(response=>response.json()).then(data=>{
                const imageUrl = data.sprites?.other?.dream_world?.front_default || data.sprites?.front_default;
                more[i].style.display = "block";
                more[i].style.backgroundImage = `url("${imageUrl}")`;
                handleImage(imageUrl, more[i]);
                more[i].firstElementChild.innerHTML = `<button>${data.name}</button>`;

            }).catch(function(){
                more[i].style.display = "none";
            });
        }

        const generateMore = id =>{
            const arr = [];
            let i = -3;
            while(arr.length<5){
                if((id + ++i) > 0 && ((id+i)!=id)) arr.push(id+i);
            }
            document.querySelector('main+h2').style.display="inline-block";
            arr.forEach((id, i)=>{
                addToMore(id, i);
            })
        }

        const search = document.querySelector('input[type=search]');
        search.addEventListener('change', catchPokemon);
        const buttons = document.querySelectorAll('.suggestion .name');
        buttons.forEach(button=>button.addEventListener('click', catchPokemon))


        // Generate list for search box
        const pokemons = [];
        fetch("https://pokeapi.co/api/v2/pokemon?limit=-1").then(list=>list.json()).then(
            list=>pokemons.push(...list.results.map(pokemon=>pokemon.name))
        )
        const list = document.getElementById('search');

        function filterMatches(match, pokemons){
            return pokemons.filter(name=>name.toLowerCase().includes(match)).sort();
        }
        function showMatches(){
            if(!this.value) return;
            const filtered = filterMatches(this.value.toLowerCase(), pokemons).slice(0, 5);
            list.innerHTML = filtered.reduce((options, name)=>options + `<option>${name}</option>`, "")
        }

        search.addEventListener('keyup', showMatches);

    </script>
</body>
</html>
